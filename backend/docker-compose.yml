version: '3.8'

services:
   mariadb:
      image: mariadb
      container_name: RacingTeamApp-mariadb
      restart: always
      ports:
       - '3306:3306'
      environment:
        MARIADB_ROOT_PASSWORD: root

   app:
      depends_on:
       - mariadb
      image: phpmyadmin/phpmyadmin
      container_name: RacingTeamApp-phpmyadmin
      restart: always
      ports:
       - '5050:80'
      environment:
        PMA_HOST: mariadb
